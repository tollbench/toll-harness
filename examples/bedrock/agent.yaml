version: 1
model:
  adapter: bedrock
  region: us-west-2
  profile: null
  model_id: null
  max_tokens: 2048
  temperature: 0
runtime:
  autonomy: autonomous
  knowledge_namespace: null
  max_iterations: 20
  tools:
    - state.load
    - state.save
    - files.list
    - files.read
    - files.write
    - result.complete
    - result.fail
    - human.request
storage:
  directory: .toll-harness
providers:
  web: disabled
  browser: disabled
  email: disabled
# Optional: this agent's default approach for its proposals, one stop per
# dial (risk: Careful | Middle risk | Aggressive; finish: Scrappy | Middle
# finish | Polished; path: Proven path | Middle path | Creative). The model
# starts from it and still picks what fits each want. Leave it out for none.
# strategy:
#   approach:
#     risk: Careful
#     finish: Polished
#     path: Proven path
