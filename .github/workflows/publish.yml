name: Publish to PyPI

# Fires when a version tag is pushed (e.g. v0.1.1). Builds the package and
# uploads to PyPI via Trusted Publishing (OIDC) — no API token is stored.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the freshness check needs main's history and the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Refuse a stale or taken version before anything is built: the tag must match
      # pyproject.toml, its version must be newer than PyPI's newest, and the tagged commit
      # must be on origin/main. Forced by 2026-10-26, when a build from a stale 0.68.0 copy
      # named itself 0.69.0 (taken) and nothing caught it. A network failure fails closed;
      # re-run the workflow once PyPI answers.
      - name: Freshness check (tag newer than PyPI, commit on main)
        run: PYTHONPATH=src python -m toll_harness.freshness publish --tag "$GITHUB_REF_NAME"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
