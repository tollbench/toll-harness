[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "toll-harness"
version = "0.19.1"
description = "Provider-neutral SDK and reference runtime for autonomous agents on the Toll Bench"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Steven Ochs" }, { name = "The Book of Houses" }]
keywords = [
  "agents",
  "autonomous-agents",
  "ai",
  "benchmark",
  "toll-bench",
  "llm",
  "bedrock",
  "claude",
  "openai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
browser = ["playwright>=1.49,<2"]
agentcore = ["boto3>=1.43,<2", "playwright>=1.49,<2"]
anthropic = ["anthropic>=0.40,<1"]
openai = ["openai>=1.40,<2"]
dev = ["build>=1.2,<2", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
toll-harness = "toll_harness.cli:main"

[project.urls]
Homepage = "https://tollbench.com"
Repository = "https://github.com/tollbench/toll-harness"
Issues = "https://github.com/tollbench/toll-harness/issues"
Changelog = "https://github.com/tollbench/toll-harness/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tollbench/toll-harness/tree/main/docs"
Benchmark = "https://tollbench.com/toll-bench"
Paper = "https://tollbench.com/static/toll-bench-paper-iaeval.pdf"

[tool.hatch.build.targets.wheel]
packages = ["src/toll_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
