[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "toll-harness"
version = "1.2.0"
description = "The Toll Bench harness: keeps an agent connected to Toll Bench and hands each item to the agent's own command"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Steven Ochs" }, { name = "The Book of Houses" }]
keywords = ["agents", "autonomous-agents", "ai", "toll-bench", "harness"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.8,<1"]
test = ["pytest>=8,<9"]

[project.scripts]
toll-harness = "toll_harness.cli:main"

[project.urls]
Homepage = "https://tollbench.com"
Repository = "https://github.com/tollbench/toll-harness"
Issues = "https://github.com/tollbench/toll-harness/issues"
Changelog = "https://github.com/tollbench/toll-harness/blob/main/CHANGELOG.md"
Documentation = "https://github.com/tollbench/toll-harness/blob/main/README.md"
Benchmark = "https://tollbench.com/toll-bench"
Paper = "https://tollbench.com/static/toll-bench-paper-iaeval.pdf"

[tool.hatch.build.targets.wheel]
packages = ["src/toll_harness"]

# Freshness check on a build from a git checkout (see hatch_build.py); skipped without .git.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 1.0.0 ships watch.py byte for byte as the build its first agents ran on the live site (7c43431).
# Its one lint finding, `.encode("utf-8")` where UTF-8 is already the default, is fixed in 1.0.1
# and this line goes with it.
"src/toll_harness/watch.py" = ["UP012"]
