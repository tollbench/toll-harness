[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "toll-harness"
version = "0.3.0"
description = "Provider-neutral SDK and reference runtime for autonomous intelligences"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Toll Harness Contributors" }]
keywords = ["agents", "bedrock", "ai", "autonomous-agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
browser = ["playwright>=1.49,<2"]
agentcore = ["boto3>=1.43,<2", "playwright>=1.49,<2"]
anthropic = ["anthropic>=0.40,<1"]
openai = ["openai>=1.40,<2"]
dev = ["build>=1.2,<2", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[project.scripts]
toll-harness = "toll_harness.cli:main"

[project.urls]
Homepage = "https://github.com/tollbench/toll-harness"
Issues = "https://github.com/tollbench/toll-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/toll_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
